<title>Jorge Control</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--surface:#141416;--line:#2b2b31;--text:#f4f4f5;--muted:#9a9aa3;--accent:#FF6B3D;--ok:#3ddc97}
html[data-theme=light]{--bg:#f5f5f7;--surface:#fff;--line:#e2e2e7;--text:#17171a;--muted:#5f5f69;--ok:#16a36b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.4 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 48px) 16px calc(env(safe-area-inset-bottom) + 32px);display:flex;flex-direction:column;gap:14px;min-height:100vh}
.logo{height:56px;align-self:flex-start}
.logo img{height:100%}
.logo .l{display:none} html[data-theme=light] .logo .d{display:none} html[data-theme=light] .logo .l{display:inline}
h1{font:700 32px "Space Grotesk",system-ui,sans-serif;margin:6px 0 0}
p.sub{margin:0 0 14px;color:var(--muted)}
a.area{position:relative;display:flex;align-items:center;gap:16px;padding:22px 20px;border-radius:22px;background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none;overflow:hidden;transition:transform .15s ease}
a.area:active{transform:scale(.98)}
a.area::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 0% 0%,var(--c),transparent 60%);opacity:.18;pointer-events:none}
a.area .ic{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:color-mix(in srgb,var(--c) 22%,transparent);flex:none}
a.area b{display:block;font:700 22px "Space Grotesk",system-ui,sans-serif}
a.area span{color:var(--muted);font-size:14px}
a.area i{margin-left:auto;font-style:normal;font-size:22px;color:var(--muted)}
.pie{margin-top:auto;text-align:center;color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<main>
  <span class="logo"><img class="d" src="logo-oscuro.png" alt="JP"><img class="l" src="logo-claro.png" alt=""></span>
  <h1 id="hola">Jorge Control</h1>
  <p class="sub" id="fecha"></p>
  <a class="area" href="./" style="--c:#FF6B3D"><span class="ic">💼</span><div><b>JP Work</b><span>Trabajo, clientes, calendario y tareas</span></div><i>›</i></a>
  <a class="area" href="fitness.html" style="--c:#3ddc97"><span class="ic">💪</span><div><b>JP Fitness</b><span>Entrenos, alimentación, objetivos y descanso</span></div><i>›</i></a>
  <p class="pie">Tus datos se guardan en tu cuenta y solo entras tú.</p>
</main>
<script src="inicio.js?v=20261127235628"></script>
</body>
</html>
