<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data: https://unpkg.com; connect-src 'self' https://inputtools.google.com https://script.google.com https://script.googleusercontent.com https://unpkg.com; img-src 'self' data: blob: https://unpkg.com; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pizarra</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f6f6f8; font-family: -apple-system, system-ui, sans-serif; overscroll-behavior: none; }
  #app { position: fixed; inset: 0; touch-action: none; }
  html, body { touch-action: none; -webkit-user-select: none; }
  #bar { position: fixed; z-index: 10; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 14px);
         display: flex; gap: 8px; align-items: center; background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
         border: 1px solid rgba(0,0,0,.08); box-shadow: 0 6px 24px rgba(0,0,0,.12); border-radius: 999px; padding: 6px 8px 6px 14px; font-size: 14px; }
  #bar b { font-weight: 700; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bar .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #st { color: #6b6b76; font-size: 13px; white-space: nowrap; }
  #bar button { border: 0; border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; background: #ff5a1f; color: #fff; }
  [hidden] { display: none !important; }
  @media (max-width: 730px) { #bar { bottom: auto; top: calc(env(safe-area-inset-top) + 64px); } }
  #bar button.sec { background: #1e1e24; white-space: nowrap; }
  #bar button:disabled { opacity: .6; }
  @media (max-width: 520px) { #nm { display: none; } }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; color: #6b6b76; font-size: 15px; text-align: center; padding: 24px; }
  @media (prefers-color-scheme: dark) {
    html, body { background: #121214; }
    #bar { background: rgba(30,30,34,.92); border-color: rgba(255,255,255,.08); color: #eee; }
    #st, #msg { color: #a0a0aa; }
  }
</style>
</head>
<body>
<div id="msg">Cargando la pizarra…</div>
<div id="app"></div>
<div id="bar" hidden><span class="dot" id="dot"></span><b id="nm"></b><span id="st">…</span><button id="limpio" type="button" class="sec" title="Convierte la letra a mano en texto y los dibujos en cuadros y flechas (si seleccionas algo, solo eso)">✨ Pasar a limpio</button><button id="close" type="button">Cerrar</button></div>
<script src="pizarra-cfg.js?v=20261124001541"></script>
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw.production.min.js"></script>
<script src="pizarra-limpio.js?v=20261124001541"></script>
<script src="pizarra.js?v=20261124001541"></script>
</body>
</html>
